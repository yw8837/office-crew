name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the [Roadmap](https://github.com/yw8837/office-crew#%EF%B8%8F-roadmap) and [existing issues](https://github.com/yw8837/office-crew/issues) first. A 👍 on an existing request also counts as a vote.
        한국어·中文·日本語로 작성해도 괜찮습니다.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and what is hard or impossible today.
      placeholder: "When I run a 5-stage team, I can't ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Office Crew to do? Mock-ups and examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches you thought about.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Providers / new AI or CLI
        - Agents and routing
        - Teams, approvals and intervention
        - Live office, skins and animations
        - Chat and desktop-app UX
        - Skills, MCP connectors and plugins
        - Usage and limits
        - Docs and translations
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to help implement this (see CONTRIBUTING.md).
          required: false
